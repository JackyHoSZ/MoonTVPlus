name: Deploy to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: moontvplus-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'JackyHoSZ/MoonTVPlus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_STORAGE_TYPE: d1
      BUILD_TARGET: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build without credentials
        run: pnpm build:cloudflare
      - name: Apply tracked D1 migrations
        run: pnpm exec wrangler d1 migrations apply moontvplus --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify schema
        run: pnpm exec wrangler d1 execute moontvplus --remote --command "SELECT COUNT(*) AS migration_count FROM d1_migrations; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','admin_config','play_records');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy and retain existing Worker Secrets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify HTTPS and database-backed configuration
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 https://tv.vafa.eu.org/api/server-config > /tmp/server-config.json
          node -e 'const c=require("/tmp/server-config.json"); if(c.StorageType!=="d1" || c.EnableRegistration!==false) process.exit(1); console.log("HTTPS, D1 config and closed registration verified");'
