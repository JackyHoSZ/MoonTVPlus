name = "moontv-plus"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat"]
main = "cloudflare/worker.js"
minify = true
# next-themes serializes its bootstrap function into HTML; esbuild name helpers
# are outside that serialized scope and cause ReferenceError in the browser.
keep_names = false
workers_dev = true
preview_urls = false
# Public TV traffic enters through the Hong Kong VPS (103.118.40.250).
# Only the fixed upstream domain belongs directly to this Worker.
routes = [
  { pattern = "origin-tv.vafa.eu.org", custom_domain = true },
]
account_id = "78171bcd948636b78f86b5550d066fbb"

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
database_id = "1a7f2a68-6917-4f16-b50e-55ee749f0106"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"

NEXT_PUBLIC_STORAGE_TYPE = "d1"
SITE_BASE = "https://tv.vafa.eu.org"
ENABLE_TV_MODE = "true"
ENABLE_TVBOX_SUBSCRIBE = "false"
WATCH_ROOM_ENABLED = "false"
NEXT_PUBLIC_ENABLE_OFFLINE_DOWNLOAD = "false"
TELEGRAM_LOGIN_ENABLED = "false"
TELEGRAM_REGISTRATION_ENABLED = "false"
DISABLE_PUBLIC_PROXIES = "true"
DANMAKU_ENABLED = "true"

[observability]
enabled = true
head_sampling_rate = 0.1
